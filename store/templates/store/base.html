<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Music Store{% endblock %}</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome საიტის აიქონებისთვის -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
</head>
<body class="container py-4">

    <!-- ნავიგაცია -->
    <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
        <a href="{% url 'home' %}" class="fs-4 fw-bold text-dark text-decoration-none">🎵 Music Store</a>
        <nav class="d-flex align-items-center">
            <a href="{% url 'home' %}" class="me-3 text-dark text-decoration-none">მთავარი</a>
            <a href="{% url 'discount_products' %}" class="text-danger fw-bold text-decoration-none me-3">ფასდაკლებები</a>
            <a href="{% url 'add_product' %}" class="btn btn-primary btn-sm">+ პროდუქტის დამატება</a>
        </nav>
    </header>

    <!-- ძირითადი შიგთავსი -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- ფუტერი -->
    <footer class="pt-3 mt-5 text-muted border-top text-center small">
        &copy; 2026 Music Store
    </footer>

</body>
</html>
