{% extends 'store/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow border-0 rounded-4 p-4 p-md-5">
            <h3 class="mb-4 text-center fw-bold text-dark">{{ title }}</h3>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label fw-semibold text-secondary">
                            {{ field.label }}
                        </label>
                        
                        {% if field.name == 'has_discount' %}
                            <!-- ჩეკბოქსის განსხვავებული სტილი, რომ სიმეტრიული იყოს -->
                            <div class="form-check mt-2">
                                {{ field }}
                                <label class="form-check-label text-dark" for="{{ field.id_for_label }}">
                                    დიახ
                                </label>
                            </div>
                        {% else %}
                            {{ field }}
                        {% endif %}
                        
                        {% if field.errors %}
                            <div class="text-danger small mt-1">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}
                
                <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary px-4 rounded-pill">გაუქმება</a>
                    <button type="submit" class="btn btn-success px-5 rounded-pill shadow-sm">შენახვა</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
