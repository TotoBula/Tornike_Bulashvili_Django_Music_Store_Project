{% extends 'store/base.html' %}

{% block content %}
<div class="py-2">
    <h3 class="fw-bold mb-2">{{ product.name }}</h3>
    <p class="fs-4 fw-bold text-primary mb-3">{{ product.price }} ₾</p>
    
    <p class="text-secondary fs-6 mb-4">{{ product.description }}</p>
    
    <a href="{% url 'home' %}" class="btn btn-sm btn-outline-secondary">← უკან დაბრუნება</a>
</div>

<!-- Product Management Buttons -->
<!-- Product Management Buttons -->
<div class="mt-4 pt-3 border-top d-flex gap-2">
    <a href="{% url 'update_product' product.id %}" class="btn btn-outline-success px-4">
        <i class="fa fa-edit me-2"></i> რედაქტირება
    </a>
    <a href="{% url 'delete_product' product.id %}" class="btn btn-outline-danger px-4">
        <i class="fa fa-trash me-2"></i> წაშლა
    </a>
</div>
{% endblock %}
