{% extends 'store/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-danger m-0">🔥 ფასდაკლებული პროდუქტები</h4>
    <a href="{% url 'home' %}" class="btn btn-sm btn-outline-secondary">← უკან</a>
</div>

<div class="list-group list-group-flush border-bottom">
    {% for product in products %}
        <a href="{% url 'product_detail' product.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
            <div>
                <div class="fw-bold text-dark">{{ product.name }}</div>
                <small class="text-muted">{{ product.description|truncatechars:70 }}</small>
            </div>
            <span class="badge bg-danger fs-6">{{ product.price }} ₾</span>
        </a>
    {% empty %}
        <p class="text-muted">ამჟამად ფასდაკლებული პროდუქტები არ არის.</p>
    {% endfor %}
</div>
{% endblock %}
